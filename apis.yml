aid: savana
name: Savana
description: 'Savana is a Malvern, Pennsylvania based financial software company, founded
  in 2009, that sells a cloud-native, API-first Digital Delivery Platform to banks,
  credit unions and fintechs. The platform sits above the core banking system rather
  than replacing it, unifying banker-facing experiences (CRM, BPM, servicing, assisted
  account opening) and customer-facing experiences (online and mobile banking, digital
  account opening) across any core, and shipping 140+ pre-built configurable servicing
  workflows. Savana markets a set of "Banking APIs" that orchestrate whole servicing
  processes — not just data exchange — between assisted and self-service channels,
  but as of this profile the company publishes no public developer portal, API reference,
  or machine-readable specification; documentation and the status page are reachable
  only by authenticated customers. Savana raised a $45M Series A led by Georgian with
  participation from Fiserv in 2022.'
